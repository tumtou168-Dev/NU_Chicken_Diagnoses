{# New password + confirm fields with show/hide, strength meter, rule checklist and match check.
   Used by reset_password.html. #}
            <div class="mb-3">
                <label for="password" class="form-label">{{ _('ពាក្យសម្ងាត់ថ្មី') }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" autocomplete="new-password" data-pw-input required autofocus>
                    <button type="button" class="input-group-text auth-eye" data-pw-toggle aria-label="{{ _('បង្ហាញ/លាក់ពាក្យសម្ងាត់') }}"><i class="bi bi-eye"></i></button>
                </div>
                <div class="pw-meter" data-pw-meter hidden
                     data-label-weak="{{ _('ខ្សោយ') }}" data-label-fair="{{ _('មធ្យម') }}"
                     data-label-good="{{ _('ល្អ') }}" data-label-strong="{{ _('រឹងមាំ') }}">
                    <div class="pw-meter-bars"><span></span><span></span><span></span><span></span></div>
                    <div class="pw-meter-text" data-pw-meter-text></div>
                </div>
                <ul class="pw-rules" id="pwRules">
                    <li data-rule="length"><i class="bi bi-circle"></i>{{ _('យ៉ាងហោច ៨ តួអក្សរ') }}</li>
                    <li data-rule="case"><i class="bi bi-circle"></i>{{ _('អក្សរធំ និងតូច') }}</li>
                    <li data-rule="number"><i class="bi bi-circle"></i>{{ _('លេខយ៉ាងហោច ១') }}</li>
                    <li data-rule="special"><i class="bi bi-circle"></i>{{ _('សញ្ញាពិសេស') }} <code>!@#$</code></li>
                </ul>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">{{ _('បញ្ជាក់ពាក្យសម្ងាត់ថ្មី') }}</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" autocomplete="new-password" data-pw-input required>
                    <button type="button" class="input-group-text auth-eye" data-pw-toggle aria-label="{{ _('បង្ហាញ/លាក់ពាក្យសម្ងាត់') }}"><i class="bi bi-eye"></i></button>
                </div>
                <div class="pw-match" data-pw-match data-pw-match-target="password" hidden
                     data-label-match="{{ _('ពាក្យសម្ងាត់ត្រូវគ្នា') }}" data-label-mismatch="{{ _('ពាក្យសម្ងាត់មិនត្រូវគ្នាទេ') }}"></div>
            </div>

<script>
// Tick each rule as it's met. Same rules the server checks in auth_routes._new_password_errors.
window.onReady(() => {
    const input = document.getElementById("password");
    const rules = document.getElementById("pwRules");
    if (!input || !rules) return;
    const tests = {
        length: (v) => v.length >= 8,
        case: (v) => /[A-Z]/.test(v) && /[a-z]/.test(v),
        number: (v) => /[0-9]/.test(v),
        special: (v) => /[!@#$%^&*()<>?"{}|_\-+=]/.test(v),
    };
    input.addEventListener("input", () => {
        rules.querySelectorAll("li").forEach((li) => {
            const ok = tests[li.dataset.rule](input.value);
            li.classList.toggle("is-met", ok);
            li.querySelector("i").className = ok ? "bi bi-check-circle-fill" : "bi bi-circle";
        });
    });
});
</script>
