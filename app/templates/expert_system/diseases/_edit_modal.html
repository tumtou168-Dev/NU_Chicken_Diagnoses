<div class="modal fade" id="editDiseaseModal_{{ disease.id }}" tabindex="-1" aria-labelledby="editDiseaseModalLabel_{{ disease.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title mb-0" id="editDiseaseModalLabel_{{ disease.id }}">{{ bi('កែប្រែជំងឺ') }}</h5>
                    <small class="text-muted">{{ disease.pair("name") }}</small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{{ _('បិទ') }}"></button>
            </div>
            <form method="post" action="{{ url_for('expert_system.diseases_edit', disease_id=disease.id) }}" novalidate id="editDiseaseForm_{{ disease.id }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body">
                    {% if disease.doctor and disease.doctor.has_role('Doctor') %}
                    <div class="alert alert-light border d-flex align-items-center gap-2 py-2 px-3 mb-3">
                        <i class="bi bi-patch-check-fill text-primary"></i>
                        <small class="text-muted">{{ _('វេជ្ជបណ្ឌិតផ្ទៀងផ្ទាត់') }}: <strong class="text-dark">Dr. {{ disease.doctor.full_name }}</strong></small>
                    </div>
                    {% endif %}
                    <div class="form-section-title">{{ _('ព័ត៌មានទូទៅ') }}</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('ឈ្មោះជំងឺ (ខ្មែរ)') }}</label>
                            <input type="text" name="name_km" class="form-control" value="{{ disease.name_km or '' }}" maxlength="120">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label is-required">{{ _('ឈ្មោះជំងឺ (អង់គ្លេស)') }}</label>
                            <input type="text" name="name" class="form-control" required value="{{ disease.name or '' }}" maxlength="120">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('ប្រភេទ##one') }}</label>
                        <select name="category_id" class="form-select">
                            <option value="0" {% if not disease.category_id %}selected{% endif %}>{{ _('គ្មានប្រភេទ') }}</option>
                            {% if categories %}
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if disease.category_id == cat.id %}selected{% endif %}>{{ cat.inline("name") }}</option>
                            {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="form-section-title">{{ _('ការពិពណ៌នា') }}</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('ការពិពណ៌នា (ខ្មែរ)') }}</label>
                            <textarea name="description_km" class="form-control" rows="3" maxlength="255">{{ disease.description_km or '' }}</textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label is-required">{{ _('ការពិពណ៌នា (អង់គ្លេស)') }}</label>
                            <textarea name="description" class="form-control" rows="3" required maxlength="255">{{ disease.description or '' }}</textarea>
                        </div>
                    </div>

                    <div class="form-section-title">{{ _('ការព្យាបាល') }}</div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ _('ការព្យាបាលដែលបានណែនាំ (ខ្មែរ)') }}</label>
                            <textarea name="treatment_km" class="form-control" rows="3" maxlength="255">{{ disease.treatment_km or '' }}</textarea>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label is-required">{{ _('ការព្យាបាលដែលបានណែនាំ (អង់គ្លេស)') }}</label>
                            <textarea name="treatment" class="form-control" rows="3" required maxlength="255">{{ disease.treatment or '' }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-soft" data-bs-dismiss="modal">{{ _('បោះបង់') }}</button>
                    <button type="submit" class="btn btn-primary">{{ _('រក្សាទុកការផ្លាស់ប្តូរ') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
