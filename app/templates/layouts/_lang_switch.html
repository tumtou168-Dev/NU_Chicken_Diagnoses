{# Khmer / English switch. Pass css='floating' for pages without a top bar. #}
<div class="lang-switch {{ css }}" role="group" aria-label="{{ _('ភាសា') }}">
    {% set back = request.full_path.rstrip('?') %}
    <a href="{{ url_for('lang.switch', code='km', next=back) }}" lang="km" hreflang="km" {% if current_lang == 'km' %}class="active" aria-current="true"{% endif %}><img class="lang-flag" src="{{ url_for('static', filename='img/flags/kh.svg') }}" alt="" aria-hidden="true"><span class="lang-label">ខ្មែរ</span></a>
    <a href="{{ url_for('lang.switch', code='en', next=back) }}" lang="en" hreflang="en" {% if current_lang == 'en' %}class="active" aria-current="true"{% endif %}><img class="lang-flag" src="{{ url_for('static', filename='img/flags/gb.svg') }}" alt="" aria-hidden="true"><span class="lang-label">EN</span></a>
</div>
