{% from "layouts/_admin_macros.html" import field, form_actions %}
{{ form.hidden_tag() }}

<div class="admin-card-body">
    <div class="row">
        <div class="col-md-6">{{ field(form.code) }}</div>
        <div class="col-md-6">{{ field(form.module, kind="select") }}</div>
    </div>
    {{ field(form.name) }}
    {{ field(form.description, rows=3) }}
</div>

{{ form_actions(form.submit, url_for('tbl_permissions.index')) }}
