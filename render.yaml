# Render Blueprint: the web app (built from the Dockerfile) and its PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository. Secrets marked "sync: false"
# are asked for when the Blueprint is created (leave empty to skip Google login / e-mail).
services:
  - type: web
    name: idns-chicken
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /auth/login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idns-chicken-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DOCTOR_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: idns-chicken-db
    plan: free
    region: singapore
    databaseName: chicken_diagnoses
    user: chicken
